<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confounding Variables in Cross-Sectional Studies</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --slate: #2c3e50;
  --navy: #1a2744;
  --teal: #2a9d8f;
  --teal-light: #40b4a6;
  --amber: #e9a820;
  --amber-light: #f0be50;
  --red: #c0392b;
  --red-light: #e74c3c;
  --green: #27ae60;
  --bg: #f5f6f8;
  --card-bg: #ffffff;
  --text: #2c3e50;
  --text-light: #5a6c7d;
  --border: #dce1e8;
  --stress: #e07c4f;
  --no-stress: #8e99a4;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

h1, h2, h3 { font-family: 'Source Serif 4', serif; }

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

header {
  text-align: center;
  margin-bottom: 2rem;
  padding-bottom: 1.5rem;
  border-bottom: 2px solid var(--border);
}

header h1 {
  font-size: 2rem;
  color: var(--navy);
  margin-bottom: 0.5rem;
  font-weight: 700;
}

header p {
  color: var(--text-light);
  font-size: 0.95rem;
  max-width: 640px;
  margin: 0 auto;
}

/* Controls */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.5rem;
  padding: 1.25rem;
  background: var(--card-bg);
  border-radius: 10px;
  border: 1px solid var(--border);
}

.control-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.control-group label {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-light);
}

.control-group input[type="range"] {
  width: 120px;
  accent-color: var(--teal);
}

.control-group select {
  padding: 0.3rem 0.5rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  background: #fff;
  color: var(--text);
}

.n-display {
  font-weight: 600;
  color: var(--navy);
  min-width: 2rem;
  text-align: center;
}

.seed-display {
  font-size: 0.78rem;
  color: var(--text-light);
  font-family: monospace;
}

.btn {
  padding: 0.5rem 1.25rem;
  border: none;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-primary { background: var(--teal); color: #fff; }
.btn-primary:hover { background: var(--teal-light); }
.btn-secondary { background: var(--amber); color: var(--navy); }
.btn-secondary:hover { background: var(--amber-light); }
.btn-outline {
  background: transparent;
  color: var(--navy);
  border: 2px solid var(--navy);
}
.btn-outline:hover { background: var(--navy); color: #fff; }

/* Explainer */
.explainer {
  background: var(--card-bg);
  border-left: 3px solid var(--teal);
  padding: 0.75rem 1rem;
  margin-bottom: 1.5rem;
  border-radius: 0 8px 8px 0;
  font-size: 0.88rem;
  color: var(--text-light);
}

/* Cards */
.card {
  background: var(--card-bg);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.5rem;
}

.card h3 {
  font-size: 1rem;
  color: var(--navy);
  margin-bottom: 0.75rem;
}

/* Comparison panels */
.comparison {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
}

.group-card {
  background: var(--card-bg);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 1.25rem 1.5rem;
}

.group-card.fb { border-top: 3px solid var(--teal); }
.group-card.no-fb { border-top: 3px solid var(--navy); }

.group-card h3 { font-size: 1rem; margin-bottom: 0.5rem; }
.group-card.fb h3 { color: var(--teal); }
.group-card.no-fb h3 { color: var(--navy); }

.group-n {
  font-size: 0.82rem;
  color: var(--text-light);
  margin-bottom: 0.75rem;
}

/* Person icons */
.icon-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 1.5px;
  margin-bottom: 0.25rem;
}

.person-icon {
  width: 8px;
  height: 8px;
  border-radius: 1.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0;
  font-weight: 700;
  line-height: 1;
}

.person-icon.stressed {
  background: var(--stress);
  box-shadow: 0 0 0 1px #c0392b;
}

.person-icon.not-stressed {
  background: var(--no-stress);
}

.icon-legend {
  display: flex;
  gap: 1rem;
  font-size: 0.75rem;
  color: var(--text-light);
  margin-bottom: 0.5rem;
}

.icon-legend span {
  display: flex;
  align-items: center;
  gap: 4px;
}

.legend-swatch {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  font-weight: 700;
  color: #fff;
}

.legend-swatch.stressed { background: var(--stress); box-shadow: 0 0 0 1.5px #c0392b; }
.legend-swatch.not-stressed { background: var(--no-stress); }

/* Stress stat */
.stress-stat {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 0.25rem;
}

.stress-detail {
  font-size: 0.82rem;
  color: var(--text-light);
}

/* Balance table */
.balance-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
  margin-bottom: 0.5rem;
}

.balance-table th {
  text-align: left;
  padding: 0.5rem 0.6rem;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--text-light);
  border-bottom: 2px solid var(--border);
}

.balance-table td {
  padding: 0.45rem 0.6rem;
  border-bottom: 1px solid var(--bg);
}

.balance-table td:first-child {
  font-weight: 500;
  color: var(--text-light);
}

.diff-badge {
  font-weight: 600;
  padding: 0.1rem 0.5rem;
  border-radius: 4px;
  font-size: 0.82rem;
}

.diff-badge.balanced { background: #e8f5e9; color: var(--green); }
.diff-badge.imbalanced { background: #fdecea; color: var(--red); }

/* Summary strip */
.summary-strip {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
  padding: 1rem;
  background: var(--bg);
  border-radius: 8px;
  margin-bottom: 1rem;
}

.summary-item {
  text-align: center;
  min-width: 120px;
}

.summary-item .label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-light);
  margin-bottom: 0.2rem;
}

.summary-item .value {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--navy);
}

.summary-item .value.match { color: var(--green); }
.summary-item .value.mismatch { color: var(--red); }

/* Within-level cards */
.within-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.within-card {
  background: var(--card-bg);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 1rem;
  text-align: center;
}

.within-card h4 {
  font-family: 'Source Serif 4', serif;
  font-size: 0.95rem;
  color: var(--navy);
  margin-bottom: 0.5rem;
}

.within-bar-row {
  display: flex;
  gap: 0.5rem;
  align-items: flex-end;
  justify-content: center;
  height: 80px;
  margin-bottom: 0.5rem;
}

.within-bar {
  width: 40px;
  border-radius: 4px 4px 0 0;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 4px;
  font-size: 0.72rem;
  font-weight: 600;
  color: #fff;
  min-height: 2px;
  transition: height 0.3s;
}

.within-bar.fb { background: var(--teal); }
.within-bar.nfb { background: var(--navy); }

.within-labels {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  font-size: 0.72rem;
  color: var(--text-light);
  margin-bottom: 0.4rem;
}

.within-diff {
  font-weight: 600;
  font-size: 0.9rem;
  margin-bottom: 0.15rem;
}

.within-n {
  font-size: 0.72rem;
  color: var(--text-light);
}

/* Icon grid pair below bars */
.grid-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
  margin-top: 0.5rem;
  padding-top: 0.5rem;
  border-top: 1px solid var(--border);
}

.grid-half-label {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 0.25rem;
}

.too-few {
  font-size: 0.82rem;
  font-style: italic;
  color: var(--text-light);
  padding: 1rem 0;
}

/* Histogram canvas */
.hist-canvas-wrap {
  margin-top: 1rem;
}

.hist-canvas-wrap canvas {
  width: 100%;
  height: 220px;
  display: block;
}

.hist-legend {
  display: flex;
  gap: 1.5rem;
  justify-content: center;
  font-size: 0.75rem;
  color: var(--text-light);
  margin-top: 0.4rem;
}

.hist-legend span::before {
  content: '';
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  margin-right: 4px;
  vertical-align: middle;
}

.hist-legend .raw::before { background: var(--red); opacity: 0.5; }
.hist-legend .adj::before { background: var(--teal); opacity: 0.7; }
.hist-legend .truth::before { background: var(--navy); }

/* Prompt */
.prompt {
  text-align: center;
  font-size: 0.95rem;
  color: var(--navy);
  font-style: italic;
  margin-top: 1rem;
  font-weight: 500;
}

@media (max-width: 800px) {
  .comparison { grid-template-columns: 1fr; }
  .within-row { grid-template-columns: 1fr; }
  .controls { flex-direction: column; }
  header h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Confounding Variables in Cross-Sectional Studies</h1>
    <p>Why does a raw comparison between groups sometimes mislead? This simulation shows how confounding variables create spurious associations — and what we can and can't do about it.</p>
  </header>

  <div class="controls">
    <div class="control-group">
      <label for="effectSlider">True effect of Facebook:</label>
      <input type="range" id="effectSlider" min="-20" max="30" value="0" step="1">
      <span class="n-display" id="effectDisplay">0 pp</span>
    </div>
    <button class="btn btn-primary" onclick="newPopulation()">New Population</button>
    <span class="seed-display" id="seedDisplay"></span>
  </div>

  <div id="stageArea"></div>
</div>

<script>
// --- Seeded PRNG (mulberry32) ---
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

let seed = Math.floor(Math.random() * 100000);
let rng = mulberry32(seed);

// --- State ---
let N = 1000;
let trueEffect = 0;  // in percentage points
let population = [];

// --- Data-generating process ---
const Z_LEVELS = ['High', 'Medium', 'Low'];
const Z_WEIGHTS = [1/3, 1/3, 1/3];
const P_X_GIVEN_Z = { High: 0.80, Medium: 0.50, Low: 0.20 };
const P_Y_BASE_Z = { High: 0.70, Medium: 0.40, Low: 0.15 };

function clamp01(p) { return Math.max(0, Math.min(1, p)); }

function generatePopulation() {
  rng = mulberry32(seed);
  population = [];
  for (let i = 0; i < N; i++) {
    // Z: roughly 1/3 each
    const r = rng();
    let z;
    if (r < 1/3) z = 'High';
    else if (r < 2/3) z = 'Medium';
    else z = 'Low';

    // Self-selection into X
    const pX = P_X_GIVEN_Z[z];
    const x = rng() < pX ? 1 : 0;

    // Y
    let pY = P_Y_BASE_Z[z] + (trueEffect / 100) * x;
    pY = clamp01(pY);
    const y = rng() < pY ? 1 : 0;

    population.push({ z, x, y });
  }
  document.getElementById('seedDisplay').textContent = 'seed: ' + seed;
}

// --- Stats helpers ---
function groupBy(arr, key) {
  const m = {};
  arr.forEach(p => {
    const k = typeof key === 'function' ? key(p) : p[key];
    if (!m[k]) m[k] = [];
    m[k].push(p);
  });
  return m;
}

function pctStressed(arr) {
  if (!arr || arr.length === 0) return null;
  return arr.filter(p => p.y === 1).length / arr.length * 100;
}

function computeWithinLevel(pop) {
  const results = [];
  for (const z of Z_LEVELS) {
    const level = pop.filter(p => p.z === z);
    const fb = level.filter(p => p.x === 1);
    const noFb = level.filter(p => p.x === 0);
    const pFb = fb.length >= 10 ? pctStressed(fb) : null;
    const pNoFb = noFb.length >= 10 ? pctStressed(noFb) : null;
    const diff = (pFb !== null && pNoFb !== null) ? pFb - pNoFb : null;
    results.push({ z, fb, noFb, pFb, pNoFb, diff, nFb: fb.length, nNoFb: noFb.length, nTotal: level.length });
  }
  return results;
}

function weightedEstimate(withinResults) {
  let sumW = 0, sumWD = 0;
  withinResults.forEach(r => {
    if (r.diff !== null) {
      sumW += r.nTotal;
      sumWD += r.diff * r.nTotal;
    }
  });
  return sumW > 0 ? sumWD / sumW : null;
}

// --- Rendering ---
function renderStage() {
  generatePopulation();
  const area = document.getElementById('stageArea');
  renderMain(area);
}

// --- Main render ---
function renderMain(area) {
  const fb = population.filter(p => p.x === 1);
  const noFb = population.filter(p => p.x === 0);
  const pFb = pctStressed(fb);
  const pNoFb = pctStressed(noFb);
  const rawDiff = pFb - pNoFb;

  const within = computeWithinLevel(population);
  const adjEst = weightedEstimate(within);

  const withinReversed = [within[2], within[1], within[0]]; // Low, Medium, High

  let html = `
    <div class="explainer">
      <strong>Holding constant:</strong> Instead of comparing everyone at once, compare Facebook users to non-users <em>within each level of political interest</em>. If political interest is the only confounder, this isolates the effect of Facebook.
      <div class="icon-legend" style="margin-top:0.5rem; margin-bottom:0;">
        <span><span class="legend-swatch stressed"></span> High stress</span>
        <span><span class="legend-swatch not-stressed"></span> Normal/low stress</span>
      </div>
    </div>

    <div class="within-row">
      ${renderCombinedCard(pFb, pNoFb, rawDiff, adjEst, fb.length, noFb.length)}
      ${withinReversed.map(r => renderWithinCard(r)).join('')}
    </div>
  `;
  area.innerHTML = html;
}

// --- Shared rendering helpers ---
function renderIconGrid(people) {
  return `<div class="icon-grid">${people.map(p =>
    `<div class="person-icon ${p.y === 1 ? 'stressed' : 'not-stressed'}"></div>`
  ).join('')}</div>`;
}

function renderCombinedCard(pFb, pNoFb, rawDiff, adjEst, nFb, nNoFb) {
  const fb = population.filter(p => p.x === 1);
  const noFb = population.filter(p => p.x === 0);
  const maxPct = Math.max(pFb, pNoFb, 1);
  const barScale = 70 / maxPct;
  return `
    <div class="within-card" style="border-top: 3px solid var(--amber);">
      <h4>Combined (Raw)</h4>
      <div class="within-bar-row">
        <div class="within-bar" style="background:var(--amber); height:${Math.max(2, pFb * barScale)}px;">${pFb.toFixed(0)}%</div>
        <div class="within-bar" style="background:var(--amber-light); height:${Math.max(2, pNoFb * barScale)}px;">${pNoFb.toFixed(0)}%</div>
      </div>
      <div class="within-labels"><span>FB</span><span>Non-FB</span></div>
      <div class="within-diff" style="color:var(--red);">Diff: ${fmtDiff(rawDiff)}</div>
      <div class="within-n">FB: ${nFb} · Non-FB: ${nNoFb}</div>
      <div style="margin-top:0.4rem; padding-top:0.4rem; border-top:1px solid var(--border); font-size:0.72rem; color:var(--text-light);">
        True effect: <strong style="color:var(--navy);">${fmtDiff(trueEffect)}</strong>
      </div>
      <div class="grid-pair">
        <div class="grid-half">
          <div class="grid-half-label">FB</div>
          ${renderIconGrid(fb)}
        </div>
        <div class="grid-half">
          <div class="grid-half-label">Non-FB</div>
          ${renderIconGrid(noFb)}
        </div>
      </div>
    </div>`;
}

function renderWithinCard(r) {
  if (r.pFb === null || r.pNoFb === null) {
    return `
      <div class="within-card">
        <h4>${r.z} Interest</h4>
        <div class="too-few">Too few people to compare (n &lt; 10 in one group)</div>
        <div class="within-n">FB: ${r.nFb} · Non-FB: ${r.nNoFb}</div>
      </div>`;
  }
  const maxPct = Math.max(r.pFb, r.pNoFb, 1);
  const barScale = 70 / maxPct;
  return `
    <div class="within-card">
      <h4>${r.z} Interest</h4>
      <div class="within-bar-row">
        <div class="within-bar fb" style="height:${Math.max(2, r.pFb * barScale)}px;">${r.pFb.toFixed(0)}%</div>
        <div class="within-bar nfb" style="height:${Math.max(2, r.pNoFb * barScale)}px;">${r.pNoFb.toFixed(0)}%</div>
      </div>
      <div class="within-labels"><span>FB</span><span>Non-FB</span></div>
      <div class="within-diff" style="color:${Math.abs(r.diff) < 3 ? 'var(--green)' : 'var(--navy)'};">Diff: ${fmtDiff(r.diff)}</div>
      <div class="within-n">FB: ${r.nFb} · Non-FB: ${r.nNoFb}</div>
      <div class="grid-pair">
        <div class="grid-half">
          <div class="grid-half-label">FB</div>
          ${renderIconGrid(r.fb)}
        </div>
        <div class="grid-half">
          <div class="grid-half-label">Non-FB</div>
          ${renderIconGrid(r.noFb)}
        </div>
      </div>
    </div>`;
}

function fmtDiff(d) {
  if (d === null) return 'N/A';
  const sign = d >= 0 ? '+' : '';
  return sign + d.toFixed(1) + ' pp';
}

// --- Event handlers ---
document.getElementById('effectSlider').addEventListener('input', function() {
  trueEffect = parseInt(this.value);
  document.getElementById('effectDisplay').textContent = trueEffect + ' pp';
});

document.getElementById('effectSlider').addEventListener('change', function() {
  trueEffect = parseInt(this.value);
  renderStage();
});

function newPopulation() {
  seed = Math.floor(Math.random() * 100000);
  renderStage();
}

// Init
generatePopulation();
renderStage();
</script>
</body>
</html>
